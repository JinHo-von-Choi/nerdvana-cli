[app]
name = "cart-service"
port = 8595
worker_count = 2
timeout_ms = 48000
maintenance = true

[logging]
destinations = ["stdout"]
file = "/var/log/cart-service.log"
rotate_size_bytes = 10485760

[db]
host = "db-8.internal"
port = 5432
name = "cart_service"
user = "svc_cart"
password_path = "/etc/secrets/cart-service.pw"
tls = false
connect_timeout_ms = 1000

[db.pool]
min = 4
max = 12

[cache]
enabled = true
backend = "local"
ttl_ms = 7200000
max_size_bytes = 67108864

[security]
scheme = "token"
allowed_origins = ["api.example.com", "admin.example.com"]

[limits]
request_size_bytes = 524288
burst = 31

[limits.rate]
count = 103
per = "minute"

[flags]
shadow_writes = false
strict_tls = true
gzip_bodies = true
canary_routing = true
audit_hooks = true
rate_shaping = true
warm_cache = false
trace_sampling = false
geo_fence = true
soft_delete = true

[environment]
REGION = "98"
SHARD = "v7"
BUILD_ID = "green-6"
FEATURE_SET = "emea-6"
ON_CALL = "v1"
BATCH_LIMIT = "emea-3"
CACHE_PREFIX = "green-5"
CHUNK_SIZE = "72"
LOCALE = "emea-8"
OWNER_TEAM = "v6"

