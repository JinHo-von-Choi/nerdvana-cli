[app]
name = "notify-hub"
port = 8275
worker_count = 16
timeout_ms = 20000
maintenance = true

[logging]
level = "debug"
destinations = ["stdout"]
file = "/var/log/notify-hub.log"
rotate_size_bytes = 104857600

[db]
host = "db-4.internal"
port = 3306
name = "notify_hub"
user = "svc_notify"
password_path = "/etc/secrets/notify-hub.pw"
tls = false
connect_timeout_ms = 14000

[db.pool]
max = 48

[cache]
enabled = false
backend = "local"
ttl_ms = 90000
max_size_bytes = 67108864

[security]
scheme = "token"
allowed_origins = ["docs.example.com", "beta.example.com"]

[limits]
request_size_bytes = 524288
burst = 79

[limits.rate]
count = 495
per = "minute"

[environment]
TENANT_MODE = "green-1"
OWNER_TEAM = "v2"
LOCALE = "v5"
AUDIT_SINK = "green-7"
BUILD_ID = "v4"
RELEASE_TRAIN = "v1"
DEPLOY_RING = "76"
FEATURE_SET = "v2"
ON_CALL = "53"
TIMEZONE = "green-2"
QUEUE_NAME = "green-5"

