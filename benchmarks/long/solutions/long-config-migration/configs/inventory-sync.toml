[app]
name = "inventory-sync"
port = 8824
timeout_ms = 24000
maintenance = true

[logging]
destinations = ["stdout", "file"]
file = "/var/log/inventory-sync.log"
rotate_size_bytes = 262144000

[db]
host = "db-8.internal"
port = 5432
name = "inventory_sync"
user = "svc_inventory"
password_path = "/etc/secrets/inventory-sync.pw"
tls = true
connect_timeout_ms = 9000

[db.pool]
max = 27

[security]
scheme = "basic"
token_ttl_ms = 43200000
allowed_origins = ["docs.example.com", "api.example.com", "beta.example.com"]

[limits]
request_size_bytes = 262144
burst = 52

[limits.rate]
count = 144
per = "second"

[flags]
gzip_bodies = true
lazy_load = false
pii_masking = false
strict_tls = false
soft_delete = true
trace_sampling = false
shadow_writes = false
fast_search = false
retry_v2 = false
async_notify = false
rate_shaping = false
dark_launch = true
audit_hooks = true
batch_commit = true
legacy_auth = false

[environment]
LOCALE = "20"
TIMEZONE = "71"
CACHE_PREFIX = "v5"
RELEASE_TRAIN = "blue-8"
QUEUE_NAME = "8"
AUDIT_SINK = "v3"
SENTRY_DSN = "blue-6"
DEPLOY_RING = "blue-5"
ON_CALL = "24"
CLUSTER = "emea-6"
BUILD_ID = "v3"

