[app]
name = "scheduler-core"
port = 8202
worker_count = 8
timeout_ms = 67000
maintenance = false

[logging]
destinations = ["stdout", "syslog", "journald"]
file = "/var/log/scheduler-core.log"
rotate_size_bytes = 52428800

[db]
host = "db-5.internal"
port = 5432
name = "scheduler_core"
user = "svc_scheduler"
password_path = "/etc/secrets/scheduler-core.pw"
tls = true
connect_timeout_ms = 4000

[db.pool]
min = 2
max = 18

[cache]
enabled = true
backend = "memcached"
ttl_ms = 1800000
max_size_bytes = 134217728

[security]
scheme = "basic"
token_ttl_ms = 43200000
allowed_origins = ["api.example.com", "beta.example.com", "docs.example.com", "admin.example.com"]

[limits]
request_size_bytes = 524288
burst = 70

[limits.rate]
count = 101
per = "second"

[flags]
batch_commit = false
fast_search = true
legacy_auth = false
async_notify = false
retry_v2 = false
gzip_bodies = false
bulk_export = true
lazy_load = false

[environment]
LOCALE = "blue-8"
REGION = "v3"
TRACE_RATE = "blue-4"
SENTRY_DSN = "v3"
BUILD_ID = "v5"
SHARD = "emea-1"
CLUSTER = "5"
CACHE_PREFIX = "blue-5"
RELEASE_TRAIN = "v3"
TIMEZONE = "v7"
OWNER_TEAM = "emea-1"

