[app]
name = "search-gateway"
port = 8090
worker_count = 2
timeout_ms = 66000
maintenance = false

[logging]
level = "error"
destinations = ["file"]
file = "/var/log/search-gateway.log"
rotate_size_bytes = 262144000

[db]
host = "db-4.internal"
port = 5433
name = "search_gateway"
user = "svc_search"
password_path = "/etc/secrets/search-gateway.pw"
tls = true
connect_timeout_ms = 13000

[db.pool]
max = 40

[cache]
enabled = false
backend = "local"
ttl_ms = 90000
max_size_bytes = 134217728

[security]
scheme = "token"
allowed_origins = ["beta.example.com", "static.example.com"]

[limits]
request_size_bytes = 1048576
burst = 51

[limits.rate]
count = 332
per = "minute"

[flags]
strict_tls = true
soft_delete = true
audit_hooks = true
rate_shaping = true

[environment]
REGION = "87"
RELEASE_TRAIN = "green-7"
CACHE_PREFIX = "16"
SENTRY_DSN = "v7"
RETRY_BUDGET = "green-7"
BUILD_ID = "v7"
SHARD = "v2"
TRACE_RATE = "v4"
TENANT_MODE = "blue-2"

