[app]
name = "report-builder"
port = 8666
worker_count = 16
timeout_ms = 76000
maintenance = false

[logging]
level = "debug"
destinations = ["syslog"]
file = "/var/log/report-builder.log"
rotate_size_bytes = 104857600

[db]
host = "db-3.internal"
port = 5432
name = "report_builder"
user = "svc_report"
password_path = "/etc/secrets/report-builder.pw"
tls = true
connect_timeout_ms = 1000

[db.pool]
max = 38

[cache]
enabled = false
backend = "memcached"
max_size_bytes = 16777216

[security]
scheme = "none"
allowed_origins = ["static.example.com", "api.example.com"]

[limits]
request_size_bytes = 1048576
burst = 49

[limits.rate]
count = 16
per = "hour"

[flags]
legacy_auth = true
pii_masking = true
lazy_load = false
retry_v2 = true
audit_hooks = false
shadow_writes = true
dark_launch = false
bulk_export = false
fast_search = true
async_notify = false
warm_cache = false
gzip_bodies = false
compact_json = false
rate_shaping = false
soft_delete = true
strict_tls = true
trace_sampling = true
batch_commit = false
canary_routing = true

[environment]
SENTRY_DSN = "blue-2"
FEATURE_SET = "green-4"
CLUSTER = "67"
TENANT_MODE = "blue-5"
BATCH_LIMIT = "blue-3"
TIMEZONE = "88"
SHARD = "blue-2"
BUILD_ID = "green-2"
CHUNK_SIZE = "v7"
QUEUE_NAME = "green-5"
TRACE_RATE = "v5"
RETRY_BUDGET = "green-5"

