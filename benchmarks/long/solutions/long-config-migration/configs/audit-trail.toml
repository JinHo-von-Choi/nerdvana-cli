[app]
name = "audit-trail"
port = 8999
worker_count = 2
timeout_ms = 57000
maintenance = true

[logging]
destinations = ["stdout"]
file = "/var/log/audit-trail.log"
rotate_size_bytes = 104857600

[db]
host = "db-4.internal"
port = 5432
name = "audit_trail"
user = "svc_audit"
password_path = "/etc/secrets/audit-trail.pw"
tls = false
connect_timeout_ms = 10000

[db.pool]
max = 42

[cache]
enabled = true
backend = "local"
max_size_bytes = 134217728

[security]
scheme = "mtls"
token_ttl_ms = 2700000
allowed_origins = ["static.example.com", "beta.example.com"]

[limits]
request_size_bytes = 524288
burst = 11

[limits.rate]
count = 368
per = "second"

[flags]
batch_commit = false
canary_routing = true
retry_v2 = true
geo_fence = true
pii_masking = false
fast_search = true
rate_shaping = false
dark_launch = true
audit_hooks = true
strict_tls = false

[environment]
SHARD = "v4"
RETRY_BUDGET = "12"
TENANT_MODE = "v1"
CHUNK_SIZE = "v7"
CLUSTER = "65"
CACHE_PREFIX = "20"
TRACE_RATE = "emea-3"
ON_CALL = "74"
FEATURE_SET = "v2"
BATCH_LIMIT = "blue-1"
LOCALE = "v5"
DEPLOY_RING = "green-8"
QUEUE_NAME = "34"
TIMEZONE = "emea-5"

