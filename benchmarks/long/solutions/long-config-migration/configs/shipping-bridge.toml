[app]
name = "shipping-bridge"
port = 8205
timeout_ms = 23000
maintenance = false

[logging]
level = "warn"
destinations = ["journald", "syslog"]
file = "/var/log/shipping-bridge.log"
rotate_size_bytes = 52428800

[db]
host = "db-1.internal"
port = 3306
name = "shipping_bridge"
user = "svc_shipping"
password_path = "/etc/secrets/shipping-bridge.pw"
tls = false
connect_timeout_ms = 13000

[db.pool]
max = 55

[cache]
enabled = true
backend = "local"
ttl_ms = 1800000
max_size_bytes = 67108864

[security]
scheme = "mtls"
allowed_origins = ["api.example.com", "app.example.com", "beta.example.com", "static.example.com"]

[limits]
request_size_bytes = 262144
burst = 45

[limits.rate]
count = 443
per = "hour"

[flags]
rate_shaping = true
fast_search = false
strict_tls = true
pii_masking = true
audit_hooks = false
gzip_bodies = true
soft_delete = true
canary_routing = true
compact_json = true
retry_v2 = false
legacy_auth = false

[environment]
FEATURE_SET = "emea-8"
CLUSTER = "v7"
CHUNK_SIZE = "blue-6"
CACHE_PREFIX = "18"
RELEASE_TRAIN = "49"
BUILD_ID = "v7"
TIMEZONE = "28"
OWNER_TEAM = "v8"

