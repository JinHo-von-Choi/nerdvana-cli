[app]
name = "catalog-index"
port = 8085
worker_count = 2
timeout_ms = 8000
maintenance = false

[logging]
destinations = ["journald"]
file = "/var/log/catalog-index.log"
rotate_size_bytes = 104857600

[db]
host = "db-8.internal"
port = 3306
name = "catalog_index"
user = "svc_catalog"
password_path = "/etc/secrets/catalog-index.pw"
tls = true
connect_timeout_ms = 14000

[db.pool]
min = 2
max = 59

[security]
scheme = "basic"
allowed_origins = ["app.example.com", "beta.example.com", "docs.example.com", "api.example.com"]

[limits]
request_size_bytes = 2097152
burst = 9

[limits.rate]
count = 159
per = "second"

[flags]
dark_launch = true
strict_tls = false
warm_cache = false
legacy_auth = true
lazy_load = false
shadow_writes = true
geo_fence = true
gzip_bodies = true

[environment]
SHARD = "v7"
TRACE_RATE = "blue-7"
AUDIT_SINK = "blue-8"
RELEASE_TRAIN = "v5"
BATCH_LIMIT = "blue-8"
BUILD_ID = "62"
RETRY_BUDGET = "green-2"
ON_CALL = "green-4"
SENTRY_DSN = "v4"

