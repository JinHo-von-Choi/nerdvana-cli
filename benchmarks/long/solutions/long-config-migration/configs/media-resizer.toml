[app]
name = "media-resizer"
port = 8932
worker_count = 8
timeout_ms = 50000
maintenance = false

[logging]
level = "error"
destinations = ["stdout"]
file = "/var/log/media-resizer.log"
rotate_size_bytes = 52428800

[db]
host = "db-7.internal"
port = 3306
name = "media_resizer"
user = "svc_media"
password_path = "/etc/secrets/media-resizer.pw"
tls = true
connect_timeout_ms = 11000

[db.pool]
max = 52

[cache]
enabled = false
backend = "local"
ttl_ms = 7200000
max_size_bytes = 16777216

[security]
scheme = "mtls"
allowed_origins = ["app.example.com", "api.example.com", "beta.example.com", "static.example.com"]

[limits]
request_size_bytes = 262144
burst = 40

[limits.rate]
count = 477
per = "second"

[flags]
retry_v2 = false
audit_hooks = false
trace_sampling = true
geo_fence = false
batch_commit = true
async_notify = true
shadow_writes = false
fast_search = true
lazy_load = false
warm_cache = false
soft_delete = true
dark_launch = true
legacy_auth = false

[environment]
DEPLOY_RING = "blue-4"
SHARD = "blue-1"
SENTRY_DSN = "blue-1"
CACHE_PREFIX = "98"
CHUNK_SIZE = "v7"
RELEASE_TRAIN = "v2"
TENANT_MODE = "v2"
TIMEZONE = "22"
RETRY_BUDGET = "v4"
TRACE_RATE = "87"
OWNER_TEAM = "v3"
ON_CALL = "94"

