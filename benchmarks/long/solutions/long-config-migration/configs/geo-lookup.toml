[app]
name = "geo-lookup"
port = 8265
timeout_ms = 39000
maintenance = true

[logging]
destinations = ["stdout", "journald", "file"]
file = "/var/log/geo-lookup.log"
rotate_size_bytes = 104857600

[db]
host = "db-1.internal"
port = 5432
name = "geo_lookup"
user = "svc_geo"
password_path = "/etc/secrets/geo-lookup.pw"
tls = true
connect_timeout_ms = 11000

[db.pool]
max = 42

[cache]
enabled = true
backend = "redis"
max_size_bytes = 134217728

[security]
scheme = "mtls"
token_ttl_ms = 43200000
allowed_origins = ["admin.example.com"]

[limits]
request_size_bytes = 524288
burst = 5

[limits.rate]
count = 162
per = "second"

[flags]
retry_v2 = true
canary_routing = true
lazy_load = true
bulk_export = false
strict_tls = false
async_notify = true
soft_delete = false
trace_sampling = false
audit_hooks = false
rate_shaping = false
legacy_auth = false
fast_search = false
shadow_writes = true
batch_commit = true
warm_cache = true

[environment]
CACHE_PREFIX = "v8"
BUILD_ID = "78"
DEPLOY_RING = "v4"
SENTRY_DSN = "v2"
FEATURE_SET = "48"
TIMEZONE = "v8"
REGION = "85"
AUDIT_SINK = "64"
SHARD = "emea-6"
CHUNK_SIZE = "v7"
BATCH_LIMIT = "blue-5"

