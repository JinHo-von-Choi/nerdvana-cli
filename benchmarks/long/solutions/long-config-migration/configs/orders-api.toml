[app]
name = "orders-api"
port = 8784
timeout_ms = 41000
maintenance = true

[logging]
level = "error"
destinations = ["stdout", "syslog"]
file = "/var/log/orders-api.log"
rotate_size_bytes = 262144000

[db]
host = "db-7.internal"
port = 5432
name = "orders_api"
user = "svc_orders"
password_path = "/etc/secrets/orders-api.pw"
tls = true
connect_timeout_ms = 15000

[db.pool]
min = 2
max = 15

[security]
scheme = "none"
token_ttl_ms = 900000
allowed_origins = ["app.example.com", "admin.example.com"]

[limits]
request_size_bytes = 1048576
burst = 36

[limits.rate]
count = 125
per = "minute"

[flags]
soft_delete = false
bulk_export = false
geo_fence = false
legacy_auth = true
dark_launch = false
audit_hooks = true
compact_json = false
trace_sampling = true
async_notify = true
canary_routing = false
batch_commit = true
shadow_writes = true
fast_search = false
retry_v2 = false
gzip_bodies = false
rate_shaping = true
lazy_load = false

[environment]
CHUNK_SIZE = "v3"
TIMEZONE = "blue-6"
CACHE_PREFIX = "27"
DEPLOY_RING = "v7"
QUEUE_NAME = "49"
AUDIT_SINK = "v3"
TENANT_MODE = "81"
ON_CALL = "53"
SENTRY_DSN = "blue-5"
RELEASE_TRAIN = "emea-7"

