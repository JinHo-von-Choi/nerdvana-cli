[app]
name = "billing-worker"
port = 8620
timeout_ms = 61000
maintenance = true

[logging]
level = "warn"
destinations = ["syslog"]
file = "/var/log/billing-worker.log"
rotate_size_bytes = 52428800

[db]
host = "db-1.internal"
port = 5433
name = "billing_worker"
user = "svc_billing"
password_path = "/etc/secrets/billing-worker.pw"
tls = true
connect_timeout_ms = 15000

[db.pool]
min = 4
max = 56

[security]
scheme = "none"
token_ttl_ms = 43200000
allowed_origins = ["admin.example.com", "docs.example.com"]

[limits]
request_size_bytes = 524288
burst = 28

[limits.rate]
count = 280
per = "second"

[environment]
SENTRY_DSN = "blue-6"
TIMEZONE = "green-4"
OWNER_TEAM = "17"
AUDIT_SINK = "56"
RELEASE_TRAIN = "v7"
CLUSTER = "v3"
CHUNK_SIZE = "26"
TRACE_RATE = "emea-5"
DEPLOY_RING = "emea-7"
ON_CALL = "v8"
BUILD_ID = "v5"
LOCALE = "v8"
SHARD = "green-1"
FEATURE_SET = "green-7"
QUEUE_NAME = "61"
BATCH_LIMIT = "47"
TENANT_MODE = "green-4"

