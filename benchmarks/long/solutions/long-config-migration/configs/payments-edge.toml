[app]
name = "payments-edge"
port = 8561
worker_count = 16
timeout_ms = 8000
maintenance = false

[logging]
level = "error"
destinations = ["stdout", "file"]
file = "/var/log/payments-edge.log"
rotate_size_bytes = 104857600

[db]
host = "db-5.internal"
port = 5432
name = "payments_edge"
user = "svc_payments"
password_path = "/etc/secrets/payments-edge.pw"
tls = true
connect_timeout_ms = 18000

[db.pool]
min = 4
max = 57

[cache]
enabled = false
backend = "memcached"
ttl_ms = 90000
max_size_bytes = 134217728

[security]
scheme = "mtls"
allowed_origins = ["beta.example.com", "admin.example.com", "app.example.com", "docs.example.com"]

[limits]
request_size_bytes = 1048576
burst = 13

[limits.rate]
count = 146
per = "minute"

[flags]
bulk_export = true
rate_shaping = true

[environment]
RELEASE_TRAIN = "82"
REGION = "green-5"
CLUSTER = "86"
OWNER_TEAM = "v4"
BUILD_ID = "emea-5"
BATCH_LIMIT = "emea-2"
AUDIT_SINK = "v5"
FEATURE_SET = "v6"
RETRY_BUDGET = "green-4"
SHARD = "81"
LOCALE = "33"
TIMEZONE = "blue-5"
QUEUE_NAME = "23"
TENANT_MODE = "2"
SENTRY_DSN = "green-5"
CHUNK_SIZE = "v1"
TRACE_RATE = "v4"
CACHE_PREFIX = "emea-3"

