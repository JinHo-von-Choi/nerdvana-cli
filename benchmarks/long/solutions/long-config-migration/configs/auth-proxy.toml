[app]
name = "auth-proxy"
port = 8713
worker_count = 16
timeout_ms = 26000
maintenance = true

[logging]
destinations = ["file", "journald"]
file = "/var/log/auth-proxy.log"
rotate_size_bytes = 262144000

[db]
host = "db-1.internal"
port = 5433
name = "auth_proxy"
user = "svc_auth"
password_path = "/etc/secrets/auth-proxy.pw"
tls = true
connect_timeout_ms = 17000

[db.pool]
min = 2
max = 48

[cache]
enabled = true
backend = "memcached"
ttl_ms = 90000
max_size_bytes = 16777216

[security]
scheme = "basic"
token_ttl_ms = 900000
allowed_origins = ["static.example.com"]

[limits]
request_size_bytes = 262144
burst = 79

[limits.rate]
count = 157
per = "minute"

[flags]
audit_hooks = true
bulk_export = true
strict_tls = true
warm_cache = true

[environment]
BATCH_LIMIT = "v3"
CACHE_PREFIX = "green-4"
AUDIT_SINK = "41"
BUILD_ID = "42"
SHARD = "green-4"
OWNER_TEAM = "blue-2"
LOCALE = "v4"
TIMEZONE = "blue-3"
SENTRY_DSN = "v2"
RELEASE_TRAIN = "v6"
ON_CALL = "v8"
REGION = "44"
TENANT_MODE = "17"

